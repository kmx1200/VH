<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14342f">
<script>try{var t=localStorage.getItem("vhmaps-theme");if(t!=="dark"&&t!=="light")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VHMaps">

<title>VHMaps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { color-scheme: light; --ink:#14342f; --paper:#f3f6f1; --line:#d5ddd3; --route:#d6336c; --go:#1f7a5c; --stop:#b3261e;
    --surface:#ffffff; --surface-a:rgba(255,255,255,.94); --err:#b3261e; --me:#14342f; --map-bg:#dddddd; }
  :root[data-theme="dark"] { color-scheme: dark; --ink:#e4ede8; --paper:#17211f; --line:#36463f; --route:#ff6b9d; --go:#2b8a67; --stop:#d6453d;
    --surface:#212e2b; --surface-a:rgba(33,46,43,.94); --err:#ff8a80; --me:#4dabf7; --map-bg:#1b2523; }
  :root[data-theme="dark"] .vh-invert { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); }
  :root[data-theme="dark"] .vh-dim { filter: brightness(.72) contrast(1.05); }
  .leaflet-container { background: var(--map-bg); }
  .leaflet-tooltip { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .leaflet-tooltip-top:before { border-top-color: var(--surface); }
  .leaflet-tooltip-bottom:before { border-bottom-color: var(--surface); }
  .leaflet-tooltip-left:before { border-left-color: var(--surface); }
  .leaflet-tooltip-right:before { border-right-color: var(--surface); }
  .leaflet-control-attribution { background: var(--surface-a); color: var(--ink); }
  .leaflet-control-attribution a { color: var(--go); }
  .c-bg { fill: var(--surface); stroke: var(--line); }
  .c-n { fill: var(--err); }
  .c-needle { fill: var(--ink); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  #map { position: absolute; inset: 0; bottom: 0; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000; background: var(--paper);
    border-radius: 18px 18px 0 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -6px 24px rgba(20,52,47,.18); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat b { display: block; font-size: 1.55rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { font-size: .8rem; opacity: .7; }
  .row { display: flex; gap: 8px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 14px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #toggle { flex: 1; color: #fff; background: var(--go); font-size: 1.1rem; }
  #toggle.on { background: var(--stop); }
  .ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  #msg { font-size: .85rem; min-height: 1.2em; margin: 0 0 8px; }
  #msg.err { color: var(--err); }
  .routebar { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; display: flex; gap: 6px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 10px 0; }
  .routebar select { flex: 1; min-width: 0; font: inherit; padding: 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .routebar button { padding: 12px; box-shadow: 0 2px 8px rgba(20,52,47,.15); }
  dialog { border: 0; border-radius: 16px; padding: 16px; width: min(92vw, 420px); background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: rgba(20,52,47,.45); }
  dialog h2 { margin: 0 0 10px; font-size: 1.1rem; }
  #srvlist { list-style: none; margin: 0 0 12px; padding: 0; max-height: 50vh; overflow: auto; display: grid; gap: 6px; }
  #srvlist button { width: 100%; text-align: left; }
  [hidden] { display: none !important; }
  .tools { position: absolute; z-index: 1000; right: 10px; top: calc(66px + env(safe-area-inset-top, 0px)); display: grid; gap: 8px; }
  .tool { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(20,52,47,.18); }
  .tool[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .compass { position: absolute; z-index: 1000; left: 10px; top: calc(66px + env(safe-area-inset-top, 0px)); width: 70px;
    display: grid; justify-items: center; gap: 2px; padding: 3px 0 5px; background: var(--surface-a);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 8px rgba(20,52,47,.18); }
  .compass span { font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .legends { position: absolute; z-index: 1000; left: 10px; top: calc(160px + env(safe-area-inset-top, 0px));
    display: grid; gap: 8px; max-width: min(60vw, 240px); }
  .legend { max-height: 26vh; overflow: auto; padding: 6px 8px; font-size: .78rem;
    background: var(--surface-a); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 8px rgba(20,52,47,.18); }
  .legend div { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .legend i { flex: none; width: 18px; height: 6px; border-radius: 3px; }
  .legend h4 { margin: 0 0 2px; font-size: .75rem; opacity: .75; }
  .pr-label span { position: absolute; left: 7px
