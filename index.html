<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Temps de repos</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f4e79">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--b:#1f4e79;--r:#d32f2f;--g:#2e7d32;--bg:#f4f6f8;--c:#fff;--t:#1a1a1a}
@media(prefers-color-scheme:dark){:root{--bg:#14181c;--c:#1f252b;--t:#eceff1}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--b);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}main{max-width:760px;margin:auto;padding:8px 10px 30px}
.card{background:var(--c);border-radius:10px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0003}
button,input,select,textarea{font:inherit;padding:8px;border-radius:8px;border:1px solid #8886;background:var(--c);color:var(--t)}
button{background:var(--b);color:#fff;border:0}button.s{background:#6b7782}button.d{background:var(--r);flex:0 0 40px;min-width:40px}
.tabs{display:flex;gap:6px}.tabs button{flex:1}
.row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}.row>*{flex:1;min-width:90px}
.bar{display:grid;height:16px;border-radius:4px;overflow:hidden;margin:8px 0 2px}.bar i{background:var(--g)}.bar i.w{background:var(--r)}
.lg{display:flex;justify-content:space-between;font-size:12px;opacity:.7}
.v{padding:10px;border-radius:8px;font-weight:600;margin-top:8px}
.v.R11,.v.PM,.v.R35{background:#ffe0b2;color:#5d3a00}.v.NONE{background:#c8e6c9;color:#1b5e20}
ol{padding-left:20px;font-size:14px;margin:6px 0}.y{color:var(--r);font-weight:700}.n{color:var(--g);font-weight:700}
.warn{color:var(--r);font-size:14px}summary{cursor:pointer;margin:6px 0}small{opacity:.7}
.gr,.gh{display:grid;grid-template-columns:repeat(24,minmax(0,1fr))}.gr{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin:0 0 4px}.gh{margin-top:4px}
.gh small{font-size:11px;border-left:2px solid #888;padding-left:2px;min-width:0;overflow:hidden;white-space:nowrap}
@media(max-width:480px){.gh small{font-size:9px;padding-left:1px}}
.c{min-width:0;padding:0;height:28px;background:var(--g);border-left:1px solid #fff9;cursor:pointer}.c.h{border-left:2px solid #fff}.c.w{background:var(--r)}.gl{font-weight:600;font-size:13px;margin-top:8px}
</style></head><body>
<header><h1>Vérification des temps de repos <small>v4</small></h1><button class="s" id="cfgb" aria-label="Réglages">⚙</button></header>
<main>
<div class="tabs"><button id="t1">Semaine</button><button id="t2">Week-end</button></div>
<div class="card">
 <div class="row"><select id="serd"></select><select id="rsel"></select><input id="resp" list="dr" placeholder="Responsable"></div>
 <div class="row"><label>Date du retour (matin)<br><input type="date" id="date"></label></div>
</div>
<div id="ags"></div>
<button class="s" id="add" style="width:100%">+ Ajouter un agent</button>
<div class="row" style="margin-top:14px"><button id="pdfb">Télécharger le PDF</button><button id="snd">Envoyer par messagerie</button></div>
<datalist id="dl"></datalist><datalist id="dr"></datalist>
</main>
<dialog id="dlg"><h3>Réglages</h3>
 <label>Destinataires (un par ligne)<br><textarea id="dest" rows="4" style="width:100%"></textarea></label>
 <p><label>Importer personnel.json<br><input type="file" id="imp" accept=".json"></label></p>
 <div class="row"><button id="rst" class="d" style="flex:1">Vider la saisie</button><button id="ok">Fermer</button></div>
 <small>Données stockées uniquement sur cet appareil.</small></dialog>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="rules.js"></script>
<script>
const $=s=>document.querySelector(s),mk=()=>({n:'',nt:['','','','']}),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let NM=[];let S=J('st',{mode:'sem',serd:'',resp:'',date:new Date().toISOString().slice(0,10),ag:[mk()],sl:{s:Array(58).fill(false),w:Array(256).fill(false)}}),C=J('cfg',{});
if(!S.sl)S.sl={s:Array(58).fill(false),w:Array(256).fill(false)};S.ag.forEach(a=>{if(!a.nt)a.nt=['','','','']});
const save=()=>localStorage.setItem('st',JSON.stringify(S)),saveC=()=>localStorage.setItem('cfg',JSON.stringify(C));
const DJ=['Vendredi','Samedi','Dimanche','Lundi'],snap=t=>{if(!t)return t;let[h,m]=t.split(':').map(Number);m=Math.round(m/15)*15;if(m==60){h=(h+1)%24;m=0}return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')};
const fr=d=>d.split('-').reverse().join('/');

const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),fmt=o=>hhmm((1050+o)%1440),wf=o=>{const m=960+o;return DJ[Math.floor(m/1440)]+' '+hhmm(m%1440)};
const pt=s=>{const m=String(s).trim().match(/^(\d{1,2})\s*[h:]?\s*(\d{2})?$/);return m?m[1].padStart(2,'0')+':'+(m[2]||'00'):''};
function ivOf(sl){const o=[];for(let k=0;k<sl.length;){if(!sl[k]){k++;continue}let j=k;while(j<sl.length&&sl[j])j++;o.push({s:k*15,e:j*15});k=j}return o}
function tp(str){const l=Array(58).fill(false);let bad=0;for(const p of str.split(/[;,\n]+/)){const m=p.match(/(\d{1,2})\s*[h:]?\s*(\d{2})?\s*[-–>]+\s*(\d{1,2})\s*[h:]?\s*(\d{2})?/i);if(!m){if(p.trim())bad++;continue}
  const a=RT.wOff(`${m[1]}:${m[2]||'00'}`),b=RT.wOff(`${m[3]}:${m[4]||'00'}`);if(a==null||b==null||b<=a){bad++;continue}for(let i=Math.floor(a/15);i<Math.ceil(b/15);i++)l[i]=true}return{l,bad}}
function calc(a){
  const sem=S.mode=='sem',iv=ivOf(S.sl[sem?'s':'w']);
  if(!sem)return{r:RT.wk(iv)};
  const wd=new Date(S.date+'T12:00').getDay(),idx=wd>=2&&wd<=5?wd-2:-1;
  return{r:RT.week(iv,a.nt.map(x=>x?RT.mm(x):RT.R.def),idx)};
}
function grid(sl,sem){
  const rw=(k0,labs)=>{let k=k0,L='',X='';for(const[t,n]of labs){L+=`<small style="grid-column:span ${n}">${t}</small>`;for(let q=0;q<n;q++,k++)X+=`<i class="c${q==0?' h':''}${sl[k]?' w':''}" data-k="${k}"></i>`}return `<div class="gh">${L}</div><div class="gr">${X}</div>`};
  if(sem)return rw(0,[['17h30',2],['18h',4],['19h',4],['20h',4],['21h',4]])+rw(18,[22,23,0,1,2,3].map(x=>[x+'h',4]))+rw(42,[4,5,6,7].map(x=>[x+'h',4]));
  let k=0;return DJ.map((d,di)=>{let o=`<div class="gl">${d}</div>`;const a=di==0?16:0,b=di==3?8:24;for(let x=a;x<b;x+=6){const hs=[];for(let y=x;y<Math.min(x+6,b);y++)hs.push([y+'h',4]);o+=rw(k,hs);k+=hs.length*4}return o}).join('');
}
function steps(r){return r.st.map(s=>`<li>${esc(s.q)} <b>${s.v}</b> : <span class="${s.a?'y':'n'}">${s.a?'OUI':'NON'}</span></li>`).join('')}
function shared(){
  const sem=S.mode=='sem',r=calc(S.ag[0]).r,l=S.sl[sem?'s':'w'];
  const met=sem?`Repos max 17h30-8h00 : <b>${RT.hm(r.A)}</b> · Intervention 22h-7h : <b>${RT.hm(r.B)}</b> · Repos continu 22h-7h : <b>${RT.hm(r.C)}</b>`:`Plus grand repos consécutif : <b>${RT.hm(r.L)}</b>`;
  const txt=ivOf(l).map(v=>fmt(v.s)+'-'+fmt(v.e)).join('; ');
  return `<div class="card"><b>Interventions de l'équipe</b> <small>(saisies une fois, valables pour tous les agents)</small>
  <p><small>Cliquer ou glisser sur la grille pour marquer les périodes d'intervention (rouge). Partir d'une case rouge permet d'effacer.</small></p>
  ${grid(l,sem)}
  <div class="row">${sem?`<input data-txt="1" value="${esc(txt)}" placeholder="Ex : 22:00-23:30; 02:00-03:00" title="Saisie au clavier : début-fin séparés par des points-virgules">`:''}<button class="s" data-clr="1">Tout effacer</button></div>
  ${S.bad?`<div class="warn">${S.bad} plage(s) non comprise(s) ou hors fenêtre 17h30-8h00, ignorée(s).</div>`:''}<p>${met}</p></div>`;
}
function agent(a,i){
  const sem=S.mode=='sem',{r}=calc(a);
  const nts=sem?`<details><summary>Repos des autres nuits de la semaine <small>(défaut 14h45)</small></summary><div class="row">${['Lun→Mar','Mar→Mer','Mer→Jeu','Jeu→Ven'].map((x,k)=>`<label>${x}<br><input type="text" inputmode="numeric" size="5" placeholder="14:45" value="${a.nt[k]}" data-nt="${k}" data-i="${i}"></label>`).join('')}</div></details>`:'';
  return `<div class="card"><div class="row">${NM.length?`<select data-pick="${i}"><option value="">Choisir un agent…</option>${NM.map(x=>`<option${x==a.n?' selected':''}>${esc(x)}</option>`).join('')}</select>`:''}<input placeholder="${NM.length?'ou saisir le nom':"Nom de l'agent"}" value="${esc(a.n)}" data-name="${i}"><button class="d" data-rm="${i}">🗑</button></div>
  ${nts}<ol>${steps(r)}</ol><div class="v ${r.out}">${RT.TXT[r.out]}</div></div>`;
}
function render(){
  const P=C.pers||{serd:{},resp:[]};
  $('#serd').innerHTML='<option value="">'+(Object.keys(P.serd).length?'SERD…':'Importer personnel.json (⚙)')+'</option>'+Object.keys(P.serd).map(k=>`<option${k==S.serd?' selected':''}>${esc(k)}</option>`).join('');
  const names=S.serd&&P.serd[S.serd]?P.serd[S.serd]:[...new Set(Object.values(P.serd).flat())];
  NM=names;$('#dl').innerHTML=names.map(x=>`<option value="${esc(x)}">`).join('');
  $('#dr').innerHTML=(P.resp||[]).map(x=>`<option value="${esc(x)}">`).join('');
  $('#rsel').innerHTML='<option value="">Responsable…</option>'+(P.resp||[]).map(x=>`<option${x==S.resp?' selected':''}>${esc(x)}</option>`).join('');$('#rsel').style.display=(P.resp||[]).length?'':'none';$('#resp').value=S.resp;$('#date').value=S.date;
  $('#t1').className=S.mode=='sem'?'':'s';$('#t2').className=S.mode=='wk'?'':'s';
  $('#ags').innerHTML=shared()+S.ag.map(agent).join('');save();
}
document.addEventListener('click',e=>{
  const g=k=>e.target.dataset[k];
  if(g('clr')!=null){S.sl[S.mode=='sem'?'s':'w'].fill(false);S.bad=0;render()}
  else if(g('rm')!=null){S.ag.splice(g('rm'),1);if(!S.ag.length)S.ag.push(mk());render()}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.pick!=null){S.ag[d.pick].n=t.value;render()}
  else if(d.txt!=null){const x=tp(t.value);S.sl.s=x.l;S.bad=x.bad;render()}
  else if(d.nt!=null){S.ag[d.i].nt[d.nt]=snap(pt(t.value));render()}
});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.name!=null){S.ag[d.name].n=e.target.value;save()}});
let P=null,T=null;const paint=c=>{P.l[+c.dataset.k]=P.v;c.classList.toggle('w',P.v)};
const done=()=>{if(P){P=null;S.bad=0;render()}};
document.addEventListener('pointerdown',e=>{const c=e.target.closest&&e.target.closest('.c');if(!c)return;const l=S.sl[S.mode=='sem'?'s':'w'];
  if(e.pointerType=='mouse'){e.preventDefault();P={l,v:!l[+c.dataset.k]};paint(c)}
  else T={c,l,x:e.clientX,y:e.clientY}});  // tactile : on attend de savoir si c'est un défilement, un tap ou un glissé horizontal
document.addEventListener('pointermove',e=>{
  if(T){const dx=e.clientX-T.x,dy=e.clientY-T.y;
    if(Math.abs(dy)>8&&Math.abs(dy)>=Math.abs(dx)){T=null;return}   // défilement vertical : on n'efface/colorie rien
    if(Math.abs(dx)>8){P={l:T.l,v:!T.l[+T.c.dataset.k]};paint(T.c);T=null}   // glissé horizontal : début du coloriage
    else return}
  if(!P)return;const c=document.elementFromPoint(e.clientX,e.clientY);if(c&&c.classList.contains('c'))paint(c)});
document.addEventListener('pointerup',()=>{
  if(T){P={l:T.l,v:!T.l[+T.c.dataset.k]};paint(T.c);T=null}   // simple tap : on bascule la case
  done()});
document.addEventListener('pointercancel',()=>{T=null;done()});  // le navigateur a pris la main pour défiler
$('#serd').onchange=e=>{S.serd=e.target.value;render()};
$('#rsel').onchange=e=>{S.resp=e.target.value;render()};
$('#resp').onchange=e=>{S.resp=e.target.value;save()};
$('#date').onchange=e=>{S.date=e.target.value;render()};
$('#t1').onclick=()=>{S.mode='sem';render()};$('#t2').onclick=()=>{S.mode='wk';render()};
$('#add').onclick=()=>{S.ag.push(mk());render()};
$('#cfgb').onclick=()=>{$('#dest').value=(C.dest||[]).join('\n');$('#dlg').showModal()};
$('#ok').onclick=()=>{C.dest=$('#dest').value.split(/[\n;,]+/).map(s=>s.trim()).filter(Boolean);saveC();$('#dlg').close()};
$('#rst').onclick=()=>{S.ag=[mk()];render();$('#dlg').close()};
$('#imp').onchange=async e=>{const j=JSON.parse(await e.target.files[0].text());C.pers=j;if(j.destinataires)C.dest=j.destinataires;saveC();render();$('#dest').value=(C.dest||[]).join('\n')};

function pdf(){
  const d=new jspdf.jsPDF(),W=190,sem=S.mode=='sem';let y=15;
  const t=(s,z=10,b=0)=>{const L=d.splitTextToSize(s,W);if(y+L.length*z*.45>280){d.addPage();y=15}d.setFont('helvetica',b?'bold':'normal');d.setFontSize(z);d.text(L,10,y);y+=L.length*z*.42+2};
  t(sem?'Vérification des temps de repos en semaine':'Vérification des temps de repos du week-end',15,1);
  t(`SERD : ${S.serd||'-'}   |   Responsable : ${S.resp||'-'}   |   Date : ${fr(S.date)}`);y+=2;
  {const r=calc(S.ag[0]).r,n=r.slots.length,w=W/n;
    t("Interventions de l'équipe",12,1);
    ivOf(S.sl[sem?'s':'w']).forEach(v=>t(sem?`Intervention ${fmt(v.s)} -> ${fmt(v.e)}`:`Intervention ${wf(v.s)} -> ${wf(v.e)}`,9));
    for(let k=0;k<n;){let j=k;while(j<n&&r.slots[j]==r.slots[k])j++;d.setFillColor(...(r.slots[k]?[211,47,47]:[46,125,50]));d.rect(10+k*w,y,(j-k)*w,5,'F');k=j}
    y+=5;d.setFontSize(8);d.setFont('helvetica','normal');d.setDrawColor(90);
    (sem?[[0,'17h30'],[150,'20h'],[270,'22h'],[390,'0h'],[510,'2h'],[630,'4h'],[750,'6h'],[870,'8h00']]:[[0,'Ven 16h'],[480,'Sam 0h'],[1200,'12h'],[1920,'Dim 0h'],[2640,'12h'],[3360,'Lun 0h'],[3840,'Lun 8h']]).forEach(([o,l],k,A)=>{const x=10+o/(n*15)*W;d.line(x,y,x,y+1.5);d.text(l,x,y+5,{align:k==0?'left':k==A.length-1?'right':'center'})});
    y+=11;
    t(sem?`Repos max 17h30-8h00 : ${RT.hm(r.A)} | Intervention 22h-7h : ${RT.hm(r.B)} | Repos continu 22h-7h : ${RT.hm(r.C)}`:`Plus grand repos consécutif : ${RT.hm(r.L)}`);y+=3}
  S.ag.forEach(a=>{
    const r=calc(a).r;
    t('Agent : '+(a.n||'(non renseigné)'),12,1);
    r.st.forEach(s=>t(`- ${s.q} ${s.v} : ${s.a?'OUI':'NON'}`,9));
    t('=> '+RT.TXT[r.out],11,1);y+=4;
  });
  t("RETOUR PAR MAIL AU CHEF D'AGENCE ET ADJOINT POUR 8H30",9,1);
  return d.output('blob');
}
const fname=()=>`Repos_${S.mode=='sem'?'semaine':'weekend'}_${(S.serd||'SERD').replace(/\s+/g,'_')}_${S.date}.pdf`;
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
$('#pdfb').onclick=()=>dl(pdf(),fname());
$('#snd').onclick=async()=>{
  const b=pdf(),n=fname(),f=new File([b],n,{type:'application/pdf'}),sub=`Fiche de vérification des temps de repos - ${S.serd||''} - ${fr(S.date)}`,body='Bonjour,\n\nVeuillez trouver ci-joint la fiche de vérification des temps de repos.\n\nCordialement';
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:sub,text:body});return}}catch(e){if(e.name=='AbortError')return}
  dl(b,n);location.href=`mailto:${(C.dest||[]).join(';')}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body+'\n\n(Joindre le PDF téléchargé : '+n+')')}`;
};
if(!C.pers)fetch('personnel.json').then(r=>r.json()).then(j=>{C.pers=j;if(!C.dest)C.dest=j.destinataires||[];saveC();render()}).catch(()=>{});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
render();
</script></body></html>
