<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14342f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VHMaps">
<meta name="application-name" content="VHMaps">
<meta name="mobile-web-app-capable" content="yes">
<title>VHMaps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#14342f; --paper:#f3f6f1; --line:#d5ddd3; --route:#d6336c; --go:#1f7a5c; --stop:#b3261e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  #map { position: absolute; inset: 0; bottom: 0; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000; background: var(--paper);
    border-radius: 18px 18px 0 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -6px 24px rgba(20,52,47,.18); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat b { display: block; font-size: 1.55rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { font-size: .8rem; opacity: .7; }
  .row { display: flex; gap: 8px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 14px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #toggle { flex: 1; color: #fff; background: var(--go); font-size: 1.1rem; }
  #toggle.on { background: var(--stop); }
  .ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  #msg { font-size: .85rem; min-height: 1.2em; margin: 0 0 8px; }
  #msg.err { color: var(--stop); }
  .routebar { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; display: flex; gap: 6px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 10px 0; }
  .routebar select { flex: 1; min-width: 0; font: inherit; padding: 12px; border-radius: 12px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .routebar button { padding: 12px; box-shadow: 0 2px 8px rgba(20,52,47,.15); }
  dialog { border: 0; border-radius: 16px; padding: 16px; width: min(92vw, 420px); background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: rgba(20,52,47,.45); }
  dialog h2 { margin: 0 0 10px; font-size: 1.1rem; }
  #srvlist { list-style: none; margin: 0 0 12px; padding: 0; max-height: 50vh; overflow: auto; display: grid; gap: 6px; }
  #srvlist button { width: 100%; text-align: left; }
  [hidden] { display: none !important; }
  .tools { position: absolute; z-index: 1000; right: 10px; top: calc(66px + env(safe-area-inset-top, 0px)); display: grid; gap: 8px; }
  .tool { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; background: #fff; color: var(--ink);
    border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(20,52,47,.18); }
  .tool[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .compass { position: absolute; z-index: 1000; left: 10px; top: calc(66px + env(safe-area-inset-top, 0px)); width: 70px;
    display: grid; justify-items: center; gap: 2px; padding: 3px 0 5px; background: rgba(255,255,255,.94);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 8px rgba(20,52,47,.18); }
  .compass span { font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .legend { position: absolute; z-index: 1000; left: 10px; top: calc(160px + env(safe-area-inset-top, 0px));
    max-width: min(60vw, 240px); max-height: 28vh; overflow: auto; padding: 6px 8px; font-size: .78rem;
    background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 8px rgba(20,52,47,.18); }
  .legend div { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .legend i { flex: none; width: 18px; height: 6px; border-radius: 3px; }
  .me { position: relative; width: 26px; height: 26px; }
  .me i { position: absolute; inset: 3px; border-radius: 50%; background: var(--ink); border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.35); }
  .me .dir { position: absolute; inset: -10px; display: none; transition: transform .35s; }
  .me.has .dir { display: block; }
  .me .dir::before { content: ""; position: absolute; left: 50%; top: 0; margin-left: -8px; border-left: 8px solid transparent;
    border-right: 8px solid transparent; border-bottom: 14px solid var(--route); }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Carte VHMaps"></div>

<div class="routebar">
  <select id="route" aria-label="Itinéraire à suivre"></select>
  <button id="import" class="ghost">Importer GPX</button>
  <button id="del" class="ghost" aria-label="Supprimer cet itinéraire" hidden>✕</button>
  <input type="file" id="file" accept=".gpx,application/gpx+xml,text/xml" multiple hidden>
</div>

<div class="compass" id="compass" role="img" aria-label="Direction">
  <svg viewBox="0 0 64 64" width="60" height="60" aria-hidden="true">
    <circle cx="32" cy="32" r="30" fill="#ffffff" stroke="#d5ddd3" stroke-width="2"/>
    <text x="32" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#b3261e" font-family="system-ui,sans-serif">N</text>
    <g id="needle"><path d="M32 18 L40 42 L32 36 L24 42 Z" fill="#14342f"/></g>
  </svg>
  <span id="hdg">--</span>
</div>

<div class="legend" id="legend" hidden></div>

<div class="tools">
  <button id="fs" class="tool" aria-pressed="false" aria-label="Plein écran"></button>
  <button id="install" class="tool" aria-label="Installer l'application"></button>
</div>

<section class="sheet">
  <p id="msg" role="status">Appuyez sur « Démarrer » et gardez l'écran allumé.</p>
  <div class="stats">
    <div class="stat"><b id="dist">0,00</b><span>km</span></div>
    <div class="stat"><b id="time">00:00</b><span>durée</span></div>
    <div class="stat"><b id="speed">0,0</b><span>km/h moyenne</span></div>
  </div>
  <div class="row">
    <button id="toggle">Démarrer</button>
    <button id="gpx" class="ghost">Exporter GPX</button>
    <button id="clear" class="ghost">Effacer</button>
  </div>
</section>

<dialog id="srv">
  <h2>Itinéraires du serveur</h2>
  <ul id="srvlist"></ul>
  <div class="row">
    <button id="srvlocal" class="ghost">Depuis mon appareil</button>
    <button id="srvclose" class="ghost">Fermer</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var KEY = "itineraire-v1";
  var MAX_ACCURACY = 50;   // mètres : on ignore les points moins précis
  var MIN_STEP = 5;        // mètres : on ignore les micro-déplacements

  var map = L.map("map", { zoomControl: false }).setView([46.6, 2.5], 6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap"
  }).addTo(map);
  var refLayer = L.featureGroup().addTo(map);                                               // itinéraire à suivre (segments colorés)
  var line = L.polyline([], { color: "#d6336c", weight: 5 }).addTo(map);                    // trajet réel
  var marker = null;

  var points = [];        // {lat, lon, t}
  var elapsed = 0;        // ms cumulées
  var startedAt = null;   // horodatage du dernier démarrage
  var watchId = null, wakeLock = null, timer = null;

  var $ = function (id) { return document.getElementById(id); };
  function say(text, err) { $("msg").textContent = text; $("msg").className = err ? "err" : ""; }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ points: points, elapsed: currentElapsed() })); } catch (e) {}
  }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(KEY) || "null");
      if (d && d.points) { points = d.points; elapsed = d.elapsed || 0; }
    } catch (e) {}
  }

  function haversine(a, b) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
    var x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  // ---------- Direction ----------
  var shown = 0, hasHeading = false;
  var CARDS = ["N", "NE", "E", "SE", "S", "SO", "O", "NO"];
  function bearing(a, b) {
    var r = Math.PI / 180, dl = (b.lon - a.lon) * r;
    var y = Math.sin(dl) * Math.cos(b.lat * r);
    var x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos(dl);
    return (Math.atan2(y, x) / r + 360) % 360;
  }
  function setHeading(h) {
    h = (h + 360) % 360;
    shown += ((h - shown + 540) % 360) - 180;   // rotation par le plus court chemin
    hasHeading = true;
    $("needle").setAttribute("transform", "rotate(" + shown.toFixed(1) + " 32 32)");
    $("hdg").textContent = CARDS[Math.round(h / 45) % 8] + " " + Math.round(h) + "°";
    $("compass").setAttribute("aria-label", "Direction " + CARDS[Math.round(h / 45) % 8] + " " + Math.round(h) + " degrés");
    if (marker && marker.getElement()) {
      var el = marker.getElement().querySelector(".me");
      el.className = "me has";
      el.querySelector(".dir").style.transform = "rotate(" + shown.toFixed(1) + "deg)";
    }
  }
  function resetHeading() {
    shown = 0; hasHeading = false;
    $("needle").setAttribute("transform", "rotate(0 32 32)");
    $("hdg").textContent = "--";
    if (marker && marker.getElement()) marker.getElement().querySelector(".me").className = "me";
  }

  function totalMeters() {
    var d = 0;
    for (var i = 1; i < points.length; i++) d += haversine(points[i - 1], points[i]);
    return d;
  }
  function currentElapsed() { return elapsed + (startedAt ? Date.now() - startedAt : 0); }

  function render() {
    var km = totalMeters() / 1000, ms = currentElapsed(), s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    var pad = function (n) { return String(n).padStart(2, "0"); };
    $("dist").textContent = km.toFixed(2).replace(".", ",");
    $("time").textContent = (h ? h + ":" : "") + pad(m) + ":" + pad(sec);
    $("speed").textContent = (ms > 0 ? km / (ms / 3600000) : 0).toFixed(1).replace(".", ",");
  }

  function drawAll() {
    line.setLatLngs(points.map(function (p) { return [p.lat, p.lon]; }));
    if (points.length) map.fitBounds(line.getBounds(), { paddingTopLeft: [20, 70], paddingBottomRight: [20, 200], maxZoom: 17 });
  }

  function onPosition(pos) {
    var c = pos.coords;
    var p = { lat: c.latitude, lon: c.longitude, t: pos.timestamp };
    if (!marker) marker = L.marker([p.lat, p.lon], { interactive: false, keyboard: false, icon: L.divIcon({
      className: "", iconSize: [26, 26], iconAnchor: [13, 13], html: '<div class="me"><span class="dir"></span><i></i></div>' }) }).addTo(map);
    marker.setLatLng([p.lat, p.lon]);
    if (c.accuracy > MAX_ACCURACY) { say("Signal GPS faible (±" + Math.round(c.accuracy) + " m)…"); return; }
    var last = points[points.length - 1];
    if (typeof c.heading === "number" && !isNaN(c.heading) && (c.speed == null || c.speed > 0.5)) setHeading(c.heading);
    else if (last && haversine(last, p) >= MIN_STEP) setHeading(bearing(last, p));
    if (!last || haversine(last, p) >= MIN_STEP) {
      points.push(p);
      line.addLatLng([p.lat, p.lon]);
      map.panTo([p.lat, p.lon]);
      save();
    }
    followMsg(p);
  }

  function onError(err) {
    var texts = {
      1: "Localisation refusée. Autorisez-la dans les réglages du navigateur.",
      2: "Position introuvable. Vérifiez que le GPS est activé.",
      3: "Délai dépassé, nouvelle tentative…"
    };
    say(texts[err.code] || "Erreur de localisation.", err.code !== 3);
  }

  async function lockScreen() {
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }

  function start() {
    if (!("geolocation" in navigator)) { say("Ce navigateur ne gère pas la géolocalisation.", true); return; }
    startedAt = Date.now();
    watchId = navigator.geolocation.watchPosition(onPosition, onError, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    lockScreen();
    timer = setInterval(render, 1000);
    $("toggle").textContent = "Arrêter"; $("toggle").className = "on";
    say("Recherche du signal GPS…");
  }

  function stop() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    elapsed = currentElapsed(); startedAt = null;
    clearInterval(timer);
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
    save(); render();
    $("toggle").textContent = points.length ? "Reprendre" : "Démarrer"; $("toggle").className = "";
    say("Suivi arrêté. Exportez le tracé si besoin.");
  }

  $("toggle").onclick = function () { watchId === null ? start() : stop(); };

  $("clear").onclick = function () {
    if (!confirm("Effacer l'itinéraire enregistré ?")) return;
    if (watchId !== null) stop();
    points = []; elapsed = 0; line.setLatLngs([]); resetHeading();
    try { localStorage.removeItem(KEY); } catch (e) {}
    $("toggle").textContent = "Démarrer"; render(); say("Itinéraire effacé.");
  };

  $("gpx").onclick = function () {
    if (points.length < 2) { say("Pas assez de points à exporter.", true); return; }
    var trkpts = points.map(function (p) {
      return '<trkpt lat="' + p.lat + '" lon="' + p.lon + '"><time>' + new Date(p.t).toISOString() + "</time></trkpt>";
    }).join("");
    var gpx = '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="VHMaps" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Itinéraire</name><trkseg>' + trkpts + "</trkseg></trk></gpx>";
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([gpx], { type: "application/gpx+xml" }));
    a.download = "vhmaps-" + new Date().toISOString().slice(0, 10) + ".gpx";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };

  // Le verrou d'écran est libéré quand la page passe en arrière-plan : on le reprend au retour.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && watchId !== null) lockScreen();
  });

  // ---------- Itinéraires à suivre ----------
  var RKEY = "itineraires-v1", SKEY = "itineraire-choisi-v1", OFF_ROUTE = 50;
  var routes = [], routeId = "";

  function currentRoute() { return routes.find(function (r) { return r.id === routeId; }); }
  function saveRoutes() {
    try {
      localStorage.setItem(RKEY, JSON.stringify(routes.filter(function (r) { return !r.file; }).map(function (r) {
        var o = { id: r.id, name: r.name };
        if (r.segs) o.segs = r.segs; else o.pts = r.pts;
        return o;
      })));
      return true;
    }
    catch (e) { say("Mémoire pleine : supprimez un itinéraire.", true); return false; }
  }
  function thin(pts) {   // garde un point tous les 10 m pour alléger le stockage
    var out = [], last = null;
    pts.forEach(function (q, i) {
      var o = { lat: q[0], lon: q[1] };
      if (!last || haversine(last, o) >= 10 || i === pts.length - 1) { out.push(q); last = o; }
    });
    return out;
  }
  var REF_COLOR = "#1d6fd8";
  var PALETTE = ["#1d6fd8", "#e8590c", "#2f9e44", "#7048e8", "#c2255c", "#0b7285", "#f08c00", "#495057"];
  var GARMIN = {   // gpxx:DisplayColor (Garmin)
    black: "#000000", darkred: "#8b0000", darkgreen: "#006400", darkyellow: "#b8860b", darkblue: "#00008b",
    darkmagenta: "#8b008b", darkcyan: "#008b8b", lightgray: "#d3d3d3", darkgray: "#a9a9a9",
    red: "#e03131", green: "#2f9e44", yellow: "#f2b800", blue: "#1c7ed6", magenta: "#e64fd0", cyan: "#00b8d9"
  };
  function normColor(v) {
    if (!v) return null;
    v = v.trim();
    var k = v.toLowerCase().replace(/[\s_-]/g, "");
    if (GARMIN[k]) return GARMIN[k];
    var h = k.replace(/^#|^0x/, "");
    if (/^[0-9a-f]{8}$/.test(h)) h = h.slice(2);                 // AARRGGBB (OsmAnd) : on ignore l'opacité
    if (/^[0-9a-f]{6}$/.test(h)) return "#" + h;
    if (/^[a-z]+$/.test(k)) { var o = new Option().style; o.color = k; if (o.color) return k; }   // nom CSS (orange…)
    return null;
  }
  function childText(el, tag) {
    for (var i = 0; i < el.children.length; i++) if (el.children[i].localName === tag) return el.children[i].textContent.trim();
    return "";
  }
  function colorOf(el) {   // <extensions> … <DisplayColor> ou <color> (Garmin, OsmAnd, GPX style)
    for (var i = 0; i < el.children.length; i++) {
      if (el.children[i].localName !== "extensions") continue;
      var all = el.children[i].getElementsByTagName("*");
      for (var j = 0; j < all.length; j++) {
        var n = all[j].localName.toLowerCase();
        if (n === "displaycolor" || n === "color") { var c = normColor(all[j].textContent); if (c) return c; }
      }
    }
    return null;
  }
  function readPts(parent, tag) {
    var out = [];
    parent.querySelectorAll(tag).forEach(function (n) {
      var la = parseFloat(n.getAttribute("lat")), lo = parseFloat(n.getAttribute("lon"));
      if (!isNaN(la) && !isNaN(lo)) out.push([la, lo]);
    });
    return out;
  }
  function parseGpx(text, fallback) {
    var doc = new DOMParser().parseFromString(text, "application/xml");
    if (doc.querySelector("parsererror")) return null;
    var items = [].slice.call(doc.querySelectorAll("trk")).map(function (el) { return { el: el, trk: true }; })
      .concat([].slice.call(doc.querySelectorAll("rte")).map(function (el) { return { el: el, trk: false }; }));
    var segs = [];
    items.forEach(function (it) {
      var nm = childText(it.el, "name"), col = colorOf(it.el);
      var parts = it.trk ? [].slice.call(it.el.querySelectorAll("trkseg")) : [it.el];
      parts.forEach(function (part, k) {
        var p = readPts(part, it.trk ? "trkpt" : "rtept");
        if (p.length < 2) return;
        var name = nm || ("Segment " + (segs.length + 1));
        if (parts.length > 1) name += " (" + (k + 1) + "/" + parts.length + ")";
        segs.push({ name: name, pts: thin(p), color: (part !== it.el && colorOf(part)) || col });
      });
    });
    if (!segs.length) return null;
    segs.forEach(function (s, i) { if (!s.color) s.color = segs.length > 1 ? PALETTE[i % PALETTE.length] : REF_COLOR; });
    var metaName = ""; var meta = doc.querySelector("metadata");
    if (meta) metaName = childText(meta, "name");
    var single = items.length === 1 ? childText(items[0].el, "name") : "";
    return { name: metaName || single || fallback, segs: segs };
  }
  function fillSelect() {
    var sel = $("route");
    sel.innerHTML = "";
    sel.add(new Option("Tracé libre (aucun itinéraire)", ""));
    routes.forEach(function (r) { sel.add(new Option(r.name, r.id)); });
    sel.value = routeId;
  }
  function remember() { try { localStorage.setItem(SKEY, routeId); } catch (e) {} }
  function segsOf(r) { return r.segs || (r.pts ? [{ pts: r.pts, color: REF_COLOR, name: "" }] : []); }
  function drawRoute(r) {
    refLayer.clearLayers();
    var leg = $("legend"); leg.innerHTML = "";
    if (!r) { leg.hidden = true; return; }
    var segs = segsOf(r);
    segs.forEach(function (s) {
      var pl = L.polyline(s.pts, { color: s.color || REF_COLOR, weight: 7, opacity: .8 }).addTo(refLayer);
      if (s.name) pl.bindTooltip(s.name, { sticky: true });
    });
    line.bringToFront();   // le trajet réel reste au-dessus
    leg.hidden = segs.length < 2;
    if (segs.length > 1) segs.forEach(function (s) {
      var row = document.createElement("div"), sw = document.createElement("i");
      sw.style.background = s.color || REF_COLOR;
      row.appendChild(sw); row.appendChild(document.createTextNode(s.name || "-"));
      leg.appendChild(row);
    });
  }
  function applyRoute(fit) {
    var r = currentRoute();
    $("del").hidden = !r || !!r.file;          // les itinéraires du dépôt ne se suppriment pas ici
    if (r && r.file && !r.segs && !r.pts) {     // itinéraire du dépôt : chargé à la demande
      drawRoute(null);
      say("Chargement de l'itinéraire…");
      fetch(r.file).then(function (res) { if (!res.ok) throw 0; return res.text(); })
        .then(function (t) {
          var g = parseGpx(t, r.name);
          if (!g) throw 0;
          r.segs = g.segs;
          if (currentRoute() === r) { applyRoute(fit); say("Itinéraire chargé."); }
        })
        .catch(function () { say("Impossible de charger « " + r.name + " ».", true); });
      return;
    }
    drawRoute(r);
    if (r && fit && refLayer.getLayers().length) map.fitBounds(refLayer.getBounds(), { paddingTopLeft: [20, 70], paddingBottomRight: [20, 200] });
  }
  function followMsg(p) {
    var r = currentRoute(), segs = r ? segsOf(r) : [];
    if (!segs.length) { say("Suivi en cours."); return; }
    var min = Infinity, best = null;
    segs.forEach(function (s) {
      s.pts.forEach(function (q) { var d = haversine(p, { lat: q[0], lon: q[1] }); if (d < min) { min = d; best = s; } });
    });
    var where = best && segs.length > 1 && best.name ? " : " + best.name : "";
    if (min > OFF_ROUTE) say("Hors itinéraire : " + Math.round(min) + " m du tracé.", true);
    else say("Sur l'itinéraire" + where + " (écart " + Math.round(min) + " m).");
  }

  $("route").onchange = function () { routeId = this.value; remember(); applyRoute(true); };
  function serverRepo() {   // https://pseudo.github.io/depot/ -> { owner, repo }
    var m = location.hostname.match(/^([^.]+)\.github\.io$/);
    var repo = location.pathname.split("/")[1];
    return m && repo && !/\.html?$/i.test(repo) ? { owner: m[1], repo: repo } : null;
  }
  function listServer() {
    var gh = serverRepo();
    var viaApi = gh
      ? fetch("https://api.github.com/repos/" + gh.owner + "/" + gh.repo + "/contents/itineraires")
          .then(function (r) { if (!r.ok) throw 0; return r.json(); })
          .then(function (items) {
            return items.filter(function (i) { return /\.gpx$/i.test(i.name); })
              .map(function (i) { return { name: i.name.replace(/\.gpx$/i, ""), file: "itineraires/" + i.name }; });
          })
      : Promise.reject();
    return viaApi.catch(function () {   // repli : liste écrite à la main
      return fetch("itineraires.json", { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (l) { return l.filter(function (x) { return x && x.file; }); })
        .catch(function () { return []; });
    });
  }
  function importFromServer(it) {
    say("Téléchargement…");
    fetch(encodeURI(it.file))
      .then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (t) {
        var g = parseGpx(t, it.name);
        if (!g) throw 0;
        g.id = "s:" + it.file;   // même fichier réimporté = mise à jour, pas de doublon
        routes = routes.filter(function (x) { return x.id !== g.id; });
        routes.push(g); routeId = g.id;
        saveRoutes(); remember(); fillSelect(); applyRoute(true);
        $("srv").close();
        say("« " + g.name + " » importé.");
      })
      .catch(function () { $("srv").close(); say("Impossible de charger « " + it.name + " ».", true); });
  }
  $("import").onclick = function () {
    var ul = $("srvlist");
    ul.innerHTML = "<li>Recherche des fichiers…</li>";
    $("srv").showModal();
    listServer().then(function (list) {
      ul.innerHTML = "";
      if (!list.length) { ul.innerHTML = "<li>Aucun fichier GPX trouvé sur le serveur.</li>"; return; }
      list.forEach(function (it) {
        var li = document.createElement("li"), b = document.createElement("button");
        b.className = "ghost"; b.textContent = it.name;
        b.onclick = function () { importFromServer(it); };
        li.appendChild(b); ul.appendChild(li);
      });
    });
  };
  $("srvlocal").onclick = function () { $("srv").close(); $("file").click(); };
  $("srvclose").onclick = function () { $("srv").close(); };
  $("file").onchange = function () {
    var input = this;
    var jobs = [].slice.call(input.files).map(function (f) {
      return f.text().then(function (t) {
        var g = parseGpx(t, f.name.replace(/\.gpx$/i, ""));
        if (!g) return false;
        g.id = "r" + Date.now() + Math.random().toString(36).slice(2, 6);
        routes.push(g); routeId = g.id;
        return true;
      });
    });
    Promise.all(jobs).then(function (res) {
      var ok = res.filter(Boolean).length;
      input.value = "";
      if (ok) { saveRoutes(); remember(); fillSelect(); applyRoute(true); say(ok + " itinéraire(s) importé(s)."); }
      else say("Fichier GPX illisible.", true);
    });
  };
  $("del").onclick = function () {
    var r = currentRoute();
    if (!r || !confirm("Supprimer « " + r.name + " » ?")) return;
    routes = routes.filter(function (x) { return x.id !== r.id; });
    routeId = ""; saveRoutes(); remember(); fillSelect(); applyRoute(false);
  };
  function initRoutes() {
    var saved = "";
    try {
      routes = JSON.parse(localStorage.getItem(RKEY) || "[]");
      saved = localStorage.getItem(SKEY) || "";
    } catch (e) { routes = []; }
    function has(id) { return routes.some(function (r) { return r.id === id; }); }
    routeId = has(saved) ? saved : "";
    fillSelect(); applyRoute(true);
  }

  // ---------- Plein écran ----------
  var ICON = function (d) { return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>'; };
  var I_ENTER = ICON("M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5");
  var I_EXIT = ICON("M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5");
  var I_INSTALL = ICON("M12 4v11M7 11l5 5 5-5M5 20h14");
  var fsBtn = $("fs");
  var canFs = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function syncFs() {
    var on = isFs();
    fsBtn.setAttribute("aria-pressed", on ? "true" : "false");
    fsBtn.setAttribute("aria-label", on ? "Quitter le plein écran" : "Plein écran");
    fsBtn.innerHTML = on ? I_EXIT : I_ENTER;
    setTimeout(function () { map.invalidateSize(); }, 250);
  }
  fsBtn.hidden = !canFs;   // iPhone : pas d'API plein écran, utiliser l'écran d'accueil
  syncFs();
  fsBtn.onclick = function () {
    if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    var el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    var r = f.call(el);
    if (r && r.catch) r.catch(function () { say("Plein écran refusé par le navigateur.", true); });
  };
  document.addEventListener("fullscreenchange", syncFs);
  document.addEventListener("webkitfullscreenchange", syncFs);
  window.addEventListener("resize", function () { map.invalidateSize(); });

  // ---------- Installation (PWA) ----------
  var deferred = null, installBtn = $("install");
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  installBtn.innerHTML = I_INSTALL;
  installBtn.hidden = standalone;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; });
  window.addEventListener("appinstalled", function () { installBtn.hidden = true; deferred = null; say("VHMaps est installée."); });
  installBtn.onclick = function () {
    if (deferred) { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; }); }
    else if (ios) say("Safari : touchez Partager, puis « Sur l'écran d'accueil ».");
    else say("Menu du navigateur : « Installer l'application » ou « Ajouter à l'écran d'accueil ».");
  };
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }

  load(); render(); initRoutes();
  if (points.length) { drawAll(); $("toggle").textContent = "Reprendre"; say("Itinéraire précédent restauré."); }
})();
</script>
</body>
</html>
